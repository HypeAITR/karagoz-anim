# Prompt templates of the draw department. Every character prompt follows the sectioned contract of the
# draw-prompts skill (.claude/skills/draw-prompts/SKILL.md): REFERENCES, WHO, KEEP, CHANGE, NEVER, FACING.
# The reasons for each rule (measured on Muse Image) are in that skill. Do not change a template without running the
# prompt regression set and recording the result.
# Placeholders: {style} {facing} {support} {acting} {description} {shape} {eyes} {props}; {never} is replaced at load time.
version: 3

style: >-
  Flat-colour 2D TV cartoon style: thick clean black outlines, flat fills with at most one simple flat shadow tone,
  no texture, no gradients.

never: >-
  NEVER: no furniture of any kind (no sofa, no armchair, no chair, no table, no bed), no floor, no shadow on the
  floor, no background, no other people, no logos or brand marks anywhere (shoes included), no text except text that
  is part of the character's own clothes, no border or frame.

support_text:
  sit: >-
    BODY: sitting on an invisible seat at knee height: thighs horizontal, shins vertical, both feet flat on the
    ground below the knees; the hips are at knee height, not lower (not crouching, not squatting).
  stand: >-
    BODY: standing upright, weight on both feet, both feet flat on the ground.
  crouch: >-
    BODY: crouching, knees bent, hips lifted from the seat, both feet flat on the ground.
  lie: >-
    BODY: lying on the back on an invisible flat surface.

background: >-
  {style} Background only, no people, no characters, no logos, no text: {description}

key_pose: >-
  REFERENCES: Image 1 is the character's model sheet; edit it into a new drawing.
  WHO: the same character with the same face, proportions, hair, clothes, colours and thick black outline.
  CHANGE (new pose): {support}{acting} Mouth closed.
  {props}
  {never}
  FACING: the character faces the {facing} side of the image in a three-quarter view.
  OUTPUT: {style} One full-body drawing of only this character on a plain white background.

key_pose_next: >-
  REFERENCES: Image 1 is the character's model sheet (identity only). Image 2 is the previous pose of the same shot;
  start from image 2.
  WHO: the same character with the same face, proportions, hair, clothes, colours and thick black outline.
  KEEP from image 2: everything this text does not change, exactly as in image 2: where the body sits or stands, both
  legs and both feet, the scale and the framing.
  CHANGE: {support}{acting} Mouth closed.
  {props}
  {never}
  FACING: the character faces the {facing} side of the image in a three-quarter view.
  OUTPUT: {style} One full-body drawing of only this character on a plain white background.

inbetween: >-
  REFERENCES: Image 1 is the starting drawing and image 2 the ending drawing of the same character. Draw ONE drawing
  between them.
  KEEP: the same character at the same scale and position as in both images; everything this text does not change
  stays as in image 1.
  CHANGE: {description} Mouth closed.
  {props}
  {never}
  FACING: the character faces the {facing} side of the image.
  OUTPUT: {style} One full-body drawing of only this character on a plain white background.

mouth: >-
  Edit this image. Change ONLY the mouth; keep every other pixel the same: same character, same pose, same line
  weight, same colours, same framing, same white background. The mouth: {shape}.

eyes: >-
  Edit this image. Change ONLY the eyes; keep every other pixel the same, eyebrows unchanged. {eyes}.

mouth_shapes:
  # primary, then fallback if the primary is refused or the patch fails
  A: ["the lips pressed together in a closed line, as when saying 'm' or 'b'", "the lips closed in a simple line"]
  B: ["a narrow wide slit, as when saying 'i', teeth barely visible, not a smile", "a narrow flat open slit"]
  C: ["a medium open shape, as when saying 'e', wider than tall", "a medium open flat oval"]
  D: ["the cartoon mouth shape for saying 'ah' while talking: an open oval about as wide as the nose, filled with a flat dark brown-red colour; the chin outline stays where it is", "an open rounded mouth shape, flat dark brown-red inside"]
  E: ["a small round 'o' shape, lips rounded, dark inside, narrower than the nose", "a small round open shape"]
  F: ["small puckered lips, as when saying 'u'", "small rounded pursed lips"]
  G: ["the upper teeth resting on the lower lip, as when saying 'f' or 'v'", "the mouth for an 'f' sound"]
  H: ["slightly open with the tongue tip touching behind the upper teeth, as when saying 'l'", "slightly open for an 'l' sound"]

eye_states:
  half: "both eyes half closed: the upper eyelids lowered to cover the top half of each eye"
  closed: "both eyes fully closed: each eyelid a single curved black line where the eye was"

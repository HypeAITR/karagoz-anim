# Robot front view (yaw ~0). Same part names as the 3q_right preset.
# Seeds are [x, y] pixels in _wp/kukla-ortak/views/front.png (2400x1792).
# The character faces the viewer, so the _r side is image-left and _l is image-right.
# All 19 parts are visible in front, so no hidden:true is needed here.
# Head note: the head's main dark is one line-bounded region (region 5)
# with no chin line and no constriction toward the neck, so the engine
# correctly refuses to split it (K-0d item 2: no guess without constriction).
# The neck is therefore seeded in the lower neck band below the ring
# (region 12); the head keeps region 5 plus eyes, antenna top/base and
# ears: 7 islands, declared below.
# Features are probe points read from the drawing: eye_mid (face centre),
# seam (chest centre line, the yaw ruler), chest_grid (one-sided detail).
yaw_deg: 0
line_max_luma: 25.0
features:
  eye_mid: {part: head, point: [1200, 400], front: true}
  seam: {part: torso, point: [1222, 950], front: true}
  chest_grid: {part: torso, point: [1395, 1010], front: true}

# Robot demo character (flat colours, black outlines, rigid parts, round caps/rings).
# The character faces the viewer, so the _r side is image-left and _l is image-right.
# Seeds are [x, y] pixels in the 2400x1792 reference. SAM concepts are tried in
# order; a missing SAM mask never blocks the build (the seed alone decides).
line_max_luma: 25.0
# Probe points in the 2400x1792 reference for the cross-view report: the eye
# midpoint (front-surface depth cue) and the chest grid (one-sided detail on
# the robot's own left, image right). Measured on robot.jpg, not guessed.
features:
  eye_mid: {part: head, point: [1281, 380], front: true}
  seam: {part: torso, point: [1313, 950], front: true}
  chest_grid: {part: torso, point: [1429, 1012], front: true}

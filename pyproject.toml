[project]
name = "karagoz-anim"
version = "0.1.0"
description = "Script + voice -> 2D limited animation, produced by a team of AI agents on Meta's models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "meta-sam-parser==0.1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
karagoz = "karagoz.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karagoz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a paid external API (skipped unless KARAGOZ_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
